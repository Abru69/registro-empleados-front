<div class="login-page">
  <div class="login-branding">
    <div class="branding-inner">
      <img src="images/logo.webp" alt="" class="brand-logo-img-login" />
      <h2 class="brand-name">AltusTime</h2>
      <p class="brand-tagline">Control de asistencia para tu equipo</p>
      <ul class="brand-features">
        <li>Registro de entradas y salidas</li>
        <li>Panel con horas y reportes</li>
        <li>Alta y baja de empleados</li>
      </ul>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p class="login-subtitle">Usa tu usuario del sistema</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="field-group">
          <label for="usuario" class="field-label">Usuario</label>
          <input
            type="text"
            id="usuario"
            [(ngModel)]="usuario"
            name="usuario"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            [disabled]="isLoading"
            required
          />
        </div>

        <div class="field-group">
          <label for="password" class="field-label">Contraseña</label>
          <div class="input-group-custom">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              [disabled]="isLoading"
              required
            />
            <button type="button" class="toggle-password" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [class]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" [disabled]="isLoading" id="login-submit-btn">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Verificando...
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <p class="login-footer">Acceso solo para personal autorizado</p>
    </div>
  </div>
</div>
