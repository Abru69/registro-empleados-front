<div class="attendance-page">
  <div class="attendance-wrapper">
    <div class="attendance-card">
      <div class="clock-section">
        <p class="clock-kicker">Hora local</p>
        <div class="clock-time">{{ horaActual }}</div>
        <div class="clock-date">{{ fechaActual }}</div>
      </div>

      <div class="input-section">
        <div class="field-group">
          <label for="nombre" class="field-label">Selecciona tu nombre</label>
          <div class="name-input-wrapper">
            @if (isLoadingEmpleados) {
              <div class="select-loading" role="status">
                <div class="mini-spinner" aria-hidden="true"></div>
                <span>Cargando empleados...</span>
              </div>
            } @else if (errorLoadingEmpleados) {
              <div class="select-error" role="alert">
                <span>No se pudo cargar la lista</span>
                <button class="btn-retry" type="button" (click)="retryCargarEmpleados()">Reintentar</button>
              </div>
            } @else {
              <select
                id="nombre"
                [(ngModel)]="nombre"
                class="attendance-select"
                [disabled]="isRegistering"
              >
                <option value="" disabled selected>— Elige tu nombre —</option>
                @for (emp of empleados; track emp.id) {
                  <option [value]="emp.nombre">{{ emp.nombre }}</option>
                }
              </select>
            }
          </div>
        </div>

        <div class="btn-group-custom">
          <button
            class="btn-action btn-entrada"
            type="button"
            (click)="registrar('entrada')"
            [disabled]="isRegistering"
            id="btn-registrar-entrada"
          >
            @if (isRegistering && lastAction === 'entrada') {
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              <span>Registrando...</span>
            } @else {
              <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
              <span>Registrar entrada</span>
            }
          </button>

          <button
            class="btn-action btn-salida"
            type="button"
            (click)="registrar('salida')"
            [disabled]="isRegistering"
            id="btn-registrar-salida"
          >
            @if (isRegistering && lastAction === 'salida') {
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              <span>Registrando...</span>
            } @else {
              <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
              <span>Registrar salida</span>
            }
          </button>
        </div>
      </div>

      <div
        class="success-slot"
        [class.visible]="registrationSuccess"
        [class.success-entrada]="lastAction === 'entrada'"
        [class.success-salida]="lastAction === 'salida'"
        role="status"
        aria-live="polite"
      >
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        <span>{{ lastAction === 'salida' ? 'Salida registrada' : 'Entrada registrada' }}</span>
      </div>
    </div>
  </div>
</div>
